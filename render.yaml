# Render Blueprint: deploys the API (Docker). PostgreSQL is hosted on Neon.
# In the Render dashboard: New > Blueprint > select this repo > Apply.
# You are prompted once each for ANTHROPIC_API_KEY and the database credentials
# (never stored in the repo).
#
# The database is deliberately not a Render resource. Render's free PostgreSQL is
# deleted 30 days after creation, which silently broke this deployment once already.
# Neon's free plan is permanent, so DB_URL points there instead.

services:
  - type: web
    name: uncomplex-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Neon connection. Use the DIRECT endpoint, not the pooled one (its hostname
      # contains "-pooler") -- Hikari is already a long-lived pool. Choose the region
      # closest to this service (AWS us-west-2 for Render Oregon); a mismatched region
      # costs tens of milliseconds on every query.
      # Format: jdbc:postgresql://<host>/<database>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false # entered once in the dashboard, never synced from the repo
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value
      - key: GENERATIONS_PER_DAY
        value: "10"
      # Render does not publish its ingress proxy addresses, and all inbound traffic also
      # passes through Cloudflare, so CIDR allowlisting is not practical here. Count hops
      # instead: the number of proxies between this app and the client, socket peer included.
      # Determine it once -- deploy with LOGGING_LEVEL_COM_UNCOMPLEX_RATELIMIT=DEBUG, POST to
      # /api/roadmaps, read the x-forwarded-for line in the logs, then turn DEBUG back off.
      - key: TRUSTED_PROXY_HOPS
        sync: false # Required on Render: startup fails unless this or TRUSTED_PROXY_CIDRS is set.
      - key: CORS_ALLOWED_ORIGINS
        value: https://uncomplex.vercel.app,http://localhost:5173
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 # play nice with the free tier's 512 MB
