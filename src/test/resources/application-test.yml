spring:
  datasource:
    url: jdbc:h2:mem:uncomplex-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  ai:
    provider: mock
  rate-limit:
    generations-per-day: 1000
  link-health:
    # Tests call the link checker directly; keep the background catch-up from firing
    # real HTTP probes in a long-lived cached context.
    catch-up-initial-delay: PT24H
