name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Docker is available on ubuntu-latest, so the Testcontainers-based
      # PostgreSQL integration test runs here even though it is skipped locally.
      - name: Build and test
        run: |
          docker info > /dev/null
          ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  # The documented "docker compose up" path is otherwise never exercised: nobody developing
  # this has Docker locally, so a wrong volume mount stayed invisible. This proves the
  # database initialises AND that its data survives the container being recreated, which is
  # the part a misplaced PGDATA mount silently breaks.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the database
        run: docker compose up -d db

      - name: Wait for it to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q db)")
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && { docker compose logs db; exit 1; }
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Write a row, recreate the container, and read it back
        run: |
          docker compose exec -T db psql -U uncomplex -d uncomplex \
            -c "create table persistence_probe (id int primary key); insert into persistence_probe values (1);"
          docker compose down
          docker compose up -d db
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q db)")
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          rows=$(docker compose exec -T db psql -U uncomplex -d uncomplex -tAc "select count(*) from persistence_probe;")
          echo "rows after recreate: $rows"
          [ "$rows" = "1" ] || { echo "data did not survive -- the volume is mounted at the wrong path"; docker compose logs db; exit 1; }

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Frontend regression tests
        run: npm test

      - name: Frontend lint
        run: npm run lint

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:browser
