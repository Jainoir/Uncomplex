name: Keep API warm

# Render's free plan stops the API after about 15 minutes without traffic, and the next
# visitor then waits minutes for a cold start. This pings the liveness endpoint so the
# instance stays up. Liveness does not query the database, so Neon can still scale to zero.
#
# Cost: an always-on instance uses about 730 of the workspace's 750 free instance hours a
# month. If other free Render services share the workspace, disable this workflow
# (Actions > Keep API warm > Disable workflow) or the hours will run out before month end.
#
# GitHub delays scheduled runs under load and disables them after 60 days without repository
# activity, so this reduces cold starts rather than guaranteeing none.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping liveness
        run: |
          # A cold instance can take minutes to answer; allow for that instead of failing.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 240 \
            https://uncomplex-api.onrender.com/actuator/health/liveness || true)
          echo "liveness returned HTTP $code"
          # Any HTTP response means the request reached the instance and counted as traffic.
          if [ "$code" = "000" ]; then
            echo "::warning::No response from the API within 240s"
          fi
